<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SRC TV — Movies &amp; Series</title>
  <meta name="description" content="SRC TV — browse movies and series, save what you want to watch, and pick up where you left off.">
  <meta name="application-name" content="SRC TV">
  <meta name="theme-color" content="#161616">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://srctv.space/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SRC TV">
  <meta property="og:title" content="SRC TV — Movies &amp; Series">
  <meta property="og:description" content="Browse movies and series, save what you want to watch, and pick up where you left off.">
  <meta property="og:url" content="https://srctv.space/">
  <meta property="og:image" content="https://srctv.space/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="SRC TV">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="SRC TV — Movies &amp; Series">
  <meta name="twitter:description" content="Browse movies and series, save what you want to watch, and pick up where you left off.">
  <meta name="twitter:image" content="https://srctv.space/og.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SRC TV">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png">

  <link rel="manifest" href="manifest.json">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "SRC TV",
    "url": "https://srctv.space/",
    "description": "Browse movies and series, save what you want to watch, and pick up where you left off."
  }
  </script>

  <!-- Before Flutter. CarPlay keyboards (APTV) set input.value on Enter
       without an input event; Flutter never paints that text otherwise. -->
  <script src="ime_bridge.js"></script>

  <!-- hls.js: HLS playback for the web player (Chrome/Firefox need it; Safari
       plays HLS natively). Bundled locally so there's no runtime CDN/CSP dep. -->
  <script src="hls.min.js"></script>
  <script src="speech_align.js"></script>
</head>
<body>
  <noscript>
    <h1>SRC TV</h1>
    <p>Browse movies and series, save what you want to watch, and pick up where you left off.</p>
  </noscript>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
